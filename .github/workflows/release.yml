name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional git ref to release (defaults to current)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Extract and export release metadata
        run: |
          set -e  # Exit on any error
          
          # Extract backend image tag from docker-compose.yml
          BACKEND_IMAGE=$(grep -A10 "backend:" docker-compose.yml | grep "image:" | head -1 | sed 's/.*image: *//' | tr -d '"'"'"'')
          FRONTEND_IMAGE=$(grep -A10 "frontend:" docker-compose.yml | grep "image:" | head -1 | sed 's/.*image: *//' | tr -d '"'"'"'')
          
          # Validate images were found
          if [ -z "$BACKEND_IMAGE" ]; then
            echo "ERROR: Could not find backend image in docker-compose.yml"
            exit 1
          fi
          if [ -z "$FRONTEND_IMAGE" ]; then
            echo "ERROR: Could not find frontend image in docker-compose.yml"
            exit 1
          fi
          
          # Extract version from image tag (last part after final colon)
          VERSION=$(echo "$BACKEND_IMAGE" | rev | cut -d: -f1 | rev)
          FRONTEND_VERSION=$(echo "$FRONTEND_IMAGE" | rev | cut -d: -f1 | rev)
          
          # Validate versions were extracted
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from backend image: $BACKEND_IMAGE"
            exit 1
          fi
          if [ -z "$FRONTEND_VERSION" ]; then
            echo "ERROR: Could not extract version from frontend image: $FRONTEND_IMAGE"
            exit 1
          fi
          
          # Validate versions match
          if [ "$VERSION" != "$FRONTEND_VERSION" ]; then
            echo "ERROR: Backend ($VERSION) and frontend ($FRONTEND_VERSION) versions differ"
            exit 1
          fi
          
          # Validate semantic versioning format
          if ! echo "$VERSION" | grep -qE "^[0-9]+\.[0-9]+\.[0-9]+$"; then
            echo "ERROR: Version '$VERSION' is not in semantic versioning format (x.y.z)"
            exit 1
          fi
          
          echo "Found version: $VERSION"
          
          # Export to environment
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> "$GITHUB_ENV"

      - name: Normalize owner name for GHCR
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Show release plan
        run: |
          echo "Releasing version: $VERSION (tag $VERSION_TAG)"
          echo "Backend image: $BACKEND_IMAGE"
          echo "Frontend image: $FRONTEND_IMAGE"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure version tag does not already exist
        run: |
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists. Aborting." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dnd-charactersheetapp-backend:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dnd-charactersheetapp-backend:latest
          platforms: linux/amd64

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dnd-charactersheetapp-frontend:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dnd-charactersheetapp-frontend:latest
          platforms: linux/amd64

      - name: Create git tag
        run: |
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION_TAG" \
            --title "$VERSION_TAG" \
            --generate-notes \
            --target ${{ github.sha }} \
            --latest
